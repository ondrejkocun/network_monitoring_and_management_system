syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "NetworkMonitoringSystem.Contracts.Agents";

package nms.agents.v1;

// Communication from the agent on a monitored device to the server.
service AgentApi {
  // Enrolls the device and returns the identity the agent uses from then on.
  rpc Register (RegisterRequest) returns (RegisterReply);

  // Tells the server that the device is alive and, when measured, how its system resources are used.
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);

  // Asks for the commands waiting for this device. The agent calls it every few seconds.
  rpc FetchCommands (FetchCommandsRequest) returns (FetchCommandsReply);

  // Reports how a command handed over by FetchCommands ended.
  rpc ReportCommandResult (CommandResultRequest) returns (CommandResultReply);

  // Downloads the file of a receive command the agent has been handed: first a header, then the contents in order.
  rpc DownloadFile (DownloadFileRequest) returns (stream DownloadFileReply);
}

message AgentCredentials {
  string device_id = 1;
  string agent_key = 2;
}

// The fixed list of commands a device can be asked to carry out. There is no command that runs an arbitrary program.
enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_RESTART_DEVICE = 1;
  COMMAND_TYPE_SHUT_DOWN_DEVICE = 2;
  // Parameter: process identifier.
  COMMAND_TYPE_KILL_PROCESS = 3;
  // Parameter of the three service commands: service name.
  COMMAND_TYPE_START_SERVICE = 4;
  COMMAND_TYPE_STOP_SERVICE = 5;
  COMMAND_TYPE_RESTART_SERVICE = 6;
  COMMAND_TYPE_SYNCHRONIZE_NOW = 7;
  // Parameter of ping and traceroute: IP address or host name.
  COMMAND_TYPE_PING = 8;
  COMMAND_TYPE_TRACEROUTE = 9;
  COMMAND_TYPE_FLUSH_DNS_CACHE = 10;
  // Parameter: name of the file. The contents are downloaded with DownloadFile and saved into the inbox folder.
  COMMAND_TYPE_SEND_FILE = 11;
}

message AgentCommand {
  string id = 1;
  CommandType type = 2;
  // Empty when the command takes no parameter.
  string parameter = 3;
}

message FetchCommandsRequest {
  AgentCredentials credentials = 1;
}

message FetchCommandsReply {
  repeated AgentCommand commands = 1;
  // How long the agent should wait before asking again.
  int32 poll_interval_seconds = 2;
}

message CommandResultRequest {
  AgentCredentials credentials = 1;
  string command_id = 2;
  bool succeeded = 3;
  // What the command printed or why it failed.
  string message = 4;
}

message CommandResultReply {
}

message DownloadFileRequest {
  AgentCredentials credentials = 1;
  string command_id = 2;
}

message DownloadFileReply {
  oneof part {
    FileHeader header = 1;
    // A part of the contents, at most 1 MB.
    bytes data = 2;
  }
}

message FileHeader {
  string file_name = 1;
  int64 size = 2;
  // SHA-256 of the contents in hexadecimal; the agent checks it before keeping the file.
  string sha256 = 3;
}

message RegisterRequest {
  string enrollment_token = 1;
  string host_name = 2;
  string operating_system = 3;
}

message RegisterReply {
  AgentCredentials credentials = 1;
  int32 sync_interval_seconds = 2;
}

message HeartbeatRequest {
  AgentCredentials credentials = 1;
  // Not set when the agent could not measure the resources.
  SystemMetrics metrics = 2;
  // Complete list of what is running on the device now. Not set when the agent could not read it.
  SystemActivity activity = 3;
  // Summary of the traffic captured since the previous report. Set only while the server asks for capture.
  TrafficSummary traffic = 4;
}

// How much the device communicated, per conversation, between two reports. No packet contents are included.
message TrafficSummary {
  // When counting started and ended, by the agent's clock.
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  repeated TrafficConversation conversations = 3;
  // Why the agent cannot capture traffic, for example because TShark is not installed; empty when capture works.
  string capture_problem = 4;
}

enum TrafficTransport {
  TRAFFIC_TRANSPORT_UNSPECIFIED = 0;
  TRAFFIC_TRANSPORT_TCP = 1;
  TRAFFIC_TRANSPORT_UDP = 2;
  TRAFFIC_TRANSPORT_ICMP = 3;
  TRAFFIC_TRANSPORT_OTHER = 4;
}

message TrafficConversation {
  TrafficTransport transport = 1;
  // The highest protocol recognised in the packets, for example TLS, DNS or HTTP.
  string protocol = 2;
  string remote_address = 3;
  // The lower of the two ports; not set for traffic without ports, such as ICMP.
  optional uint32 service_port = 4;
  uint64 packets_sent = 5;
  uint64 packets_received = 6;
  uint64 bytes_sent = 7;
  uint64 bytes_received = 8;
}

message SystemActivity {
  repeated ProcessEntry processes = 1;
  repeated ListeningPortEntry listening_ports = 2;
  repeated ConnectionEntry connections = 3;
}

enum TransportProtocol {
  TRANSPORT_PROTOCOL_UNSPECIFIED = 0;
  TRANSPORT_PROTOCOL_TCP = 1;
  TRANSPORT_PROTOCOL_UDP = 2;
}

message ProcessEntry {
  uint32 pid = 1;
  string name = 2;
  // Not set when the agent is not allowed to read it, as with some system processes.
  google.protobuf.Timestamp started_at = 3;
  // Average processor load since the previous report. Not set when it cannot be measured yet.
  optional double cpu_usage_percent = 4;
  uint64 memory_bytes = 5;
}

message ListeningPortEntry {
  TransportProtocol protocol = 1;
  string local_address = 2;
  uint32 port = 3;
  // Process that opened the port.
  uint32 pid = 4;
}

message ConnectionEntry {
  TransportProtocol protocol = 1;
  string local_address = 2;
  uint32 local_port = 3;
  string remote_address = 4;
  uint32 remote_port = 5;
  string state = 6;
  // Process that owns the connection.
  uint32 pid = 7;
}

message SystemMetrics {
  // Average processor load since the previous report. Not set in the first report.
  optional double cpu_usage_percent = 1;
  uint64 memory_total_bytes = 2;
  uint64 memory_used_bytes = 3;
  repeated DiskMetrics disks = 4;
  repeated NetworkInterfaceMetrics network_interfaces = 5;
}

message DiskMetrics {
  string name = 1;
  uint64 total_bytes = 2;
  uint64 free_bytes = 3;
}

message NetworkInterfaceMetrics {
  string name = 1;
  string mac_address = 2;
  string ip_address = 3;
  bool is_up = 4;
  // Cumulative counters since the interface was started.
  uint64 bytes_sent = 5;
  uint64 bytes_received = 6;
}

message HeartbeatReply {
  // The global interval after which the agent should report again.
  int32 sync_interval_seconds = 1;
  // True while the agent should capture network traffic and send its summary with each report.
  bool capture_traffic = 2;
}
