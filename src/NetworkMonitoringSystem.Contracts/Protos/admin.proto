syntax = "proto3";

option csharp_namespace = "NetworkMonitoringSystem.Contracts.Admin";

package nms.admin.v1;

import "google/protobuf/timestamp.proto";

// Communication from the administrator's desktop application to the server.
// Every call except Login must carry the session token in the "authorization" header as "Bearer <token>".
service AdminApi {
  // Signs a user in and returns the session token for the following calls.
  rpc Login (LoginRequest) returns (LoginReply);

  // Ends the session the call is made with.
  rpc Logout (LogoutRequest) returns (LogoutReply);

  // Changes the password of the signed-in user and ends all their sessions, including this one.
  rpc ChangeOwnPassword (ChangeOwnPasswordRequest) returns (ChangeOwnPasswordReply);

  // Management of users, roles and access rules. All of these require the ManageUsers permission.
  rpc ListUsers (ListUsersRequest) returns (ListUsersReply);
  rpc CreateUser (CreateUserRequest) returns (UserInfo);
  rpc SetUserActive (SetUserActiveRequest) returns (UserInfo);
  rpc SetUserRoles (SetUserRolesRequest) returns (UserInfo);
  rpc ResetUserPassword (ResetUserPasswordRequest) returns (ResetUserPasswordReply);
  // Deletes a user for good; what they did stays in the audit under their name.
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserReply);
  rpc ListRoles (ListRolesRequest) returns (ListRolesReply);
  rpc CreateRole (CreateRoleRequest) returns (RoleInfo);
  rpc DeleteRole (DeleteRoleRequest) returns (DeleteRoleReply);
  rpc AddAccessRule (AccessRuleRequest) returns (RoleInfo);
  rpc RemoveAccessRule (AccessRuleRequest) returns (RoleInfo);

  rpc ListDevices (ListDevicesRequest) returns (ListDevicesReply);

  // Adds a device that cannot run an agent; the server checks it over the network.
  rpc AddAgentlessDevice (AddAgentlessDeviceRequest) returns (DeviceInfo);

  // Removes a device together with its recorded snapshots and outages.
  rpc RemoveDevice (RemoveDeviceRequest) returns (RemoveDeviceReply);

  // Disables or enables a device. A disabled device is not checked, is never reported offline and its agent is refused.
  rpc SetDeviceEnabled (SetDeviceEnabledRequest) returns (DeviceInfo);

  // Gives a device another name. Requires ManageDevices on the device.
  rpc RenameDevice (RenameDeviceRequest) returns (DeviceInfo);

  // Switches capture of network traffic on or off for a device with an agent. Requires ManageDevices on the device.
  rpc SetDeviceTrafficCapture (SetDeviceTrafficCaptureRequest) returns (DeviceInfo);

  // Returns how much the device communicated in a period, summed per remote address, protocol and service port.
  rpc GetDeviceTraffic (GetDeviceTrafficRequest) returns (DeviceTrafficReply);

  // Returns the most recent system resources reported by the device's agent.
  rpc GetDeviceResources (GetDeviceResourcesRequest) returns (DeviceResourcesReply);

  // Returns what the device's agent last reported as running: processes, open ports and connections.
  rpc GetDeviceActivity (GetDeviceActivityRequest) returns (DeviceActivityReply);

  // Returns the process runs and port periods of the device in a period, with start, end and owning process.
  rpc GetDeviceActivityHistory (GetDeviceActivityHistoryRequest) returns (DeviceActivityHistoryReply);

  // Returns the availability, outages, events and resource use of the device in a period.
  rpc GetDeviceHistory (GetDeviceHistoryRequest) returns (DeviceHistoryReply);

  // Returns the events of the whole system in a period, the newest first. Requires ViewEventLog.
  rpc GetEventLog (GetEventLogRequest) returns (EventLogReply);

  // Queues a command for the device's agent. Requires the permission of that command on the device.
  rpc SendCommand (SendCommandRequest) returns (CommandInfo);

  // Uploads a file and queues it for the device's agent, which saves it into its inbox folder. The first message
  // carries the header, the following ones the contents in order. Requires the SendFile permission on the device.
  rpc SendFile (stream SendFileRequest) returns (CommandInfo);

  // Returns the most recent commands sent to the device with their results, the newest first.
  rpc ListDeviceCommands (ListDeviceCommandsRequest) returns (ListDeviceCommandsReply);

  rpc GetMonitoringSettings (GetMonitoringSettingsRequest) returns (MonitoringSettingsInfo);

  // Changes the global interval in which device state is synchronized and recorded.
  rpc UpdateSyncInterval (UpdateSyncIntervalRequest) returns (MonitoringSettingsInfo);

  // Changes how many synchronizations in a row a device may miss before it is considered offline.
  rpc UpdateOfflineThreshold (UpdateOfflineThresholdRequest) returns (MonitoringSettingsInfo);

  // Changes how many days history is kept before it is deleted.
  rpc UpdateRetention (UpdateRetentionRequest) returns (MonitoringSettingsInfo);
}

enum MonitoringMode {
  MONITORING_MODE_UNSPECIFIED = 0;
  MONITORING_MODE_AGENT = 1;
  MONITORING_MODE_AGENTLESS = 2;
}

enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  DEVICE_STATUS_UNKNOWN = 1;
  DEVICE_STATUS_ONLINE = 2;
  DEVICE_STATUS_OFFLINE = 3;
}

message LoginRequest {
  string user_name = 1;
  string password = 2;
}

message LoginReply {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string user_name = 3;
  // Names of the permissions the user holds for all devices, for example "ManageDevices".
  repeated string permissions = 4;
}

message LogoutRequest {
}

message LogoutReply {
}

message ChangeOwnPasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangeOwnPasswordReply {
}

message UserInfo {
  string id = 1;
  string user_name = 2;
  bool is_active = 3;
  // True while signing in is refused after repeated wrong passwords.
  bool is_locked = 4;
  google.protobuf.Timestamp created_at = 5;
  repeated string role_ids = 6;
}

message ListUsersRequest {
}

message ListUsersReply {
  repeated UserInfo users = 1;
}

message CreateUserRequest {
  string user_name = 1;
  string password = 2;
  repeated string role_ids = 3;
}

message SetUserActiveRequest {
  string user_id = 1;
  bool is_active = 2;
}

message SetUserRolesRequest {
  string user_id = 1;
  // Replaces the roles the user has now.
  repeated string role_ids = 2;
}

message ResetUserPasswordRequest {
  string user_id = 1;
  string new_password = 2;
}

message ResetUserPasswordReply {
}

message AccessRuleInfo {
  // Name of the permission, for example "ViewDevices".
  string permission = 1;
  // The only device the rule applies to; empty when it applies to all devices.
  string device_id = 2;
}

message RoleInfo {
  string id = 1;
  string name = 2;
  // A built-in role cannot be changed or deleted.
  bool is_built_in = 3;
  repeated AccessRuleInfo rules = 4;
}

message ListRolesRequest {
}

message ListRolesReply {
  repeated RoleInfo roles = 1;
  // Names of all permissions a rule can allow.
  repeated string permissions = 2;
}

message CreateRoleRequest {
  string name = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserReply {
}

message DeleteRoleRequest {
  string role_id = 1;
}

message DeleteRoleReply {
}

message AccessRuleRequest {
  string role_id = 1;
  AccessRuleInfo rule = 2;
}

message DeviceInfo {
  string id = 1;
  string name = 2;
  MonitoringMode monitoring_mode = 3;
  // Empty when the device has no host name.
  string host_name = 4;
  // Empty when the device has no known IP address.
  string ip_address = 5;
  DeviceStatus status = 6;
  // Not set when the device has never been seen.
  google.protobuf.Timestamp last_seen_at = 7;
  bool is_enabled = 8;
  string operating_system = 9;
  // TCP port the server tries when the device does not answer ping; not set when it relies on ping only.
  optional int32 tcp_port = 10;
  // True while the device's agent is asked to capture network traffic.
  bool capture_traffic = 11;
  // Why the agent cannot capture although it is asked to; empty when there is no problem.
  string traffic_capture_problem = 12;
  // Names of the permissions the signed-in user holds on this device, by a rule for it or for all devices.
  repeated string permissions = 13;
}

message ListDevicesRequest {
}

message ListDevicesReply {
  repeated DeviceInfo devices = 1;
}

message AddAgentlessDeviceRequest {
  string name = 1;
  string ip_address = 2;
  // Optional TCP port for a device that blocks ping.
  optional int32 tcp_port = 3;
}

message RemoveDeviceRequest {
  string id = 1;
}

message RemoveDeviceReply {
}

message SetDeviceEnabledRequest {
  string id = 1;
  bool is_enabled = 2;
}

message RenameDeviceRequest {
  string id = 1;
  string name = 2;
}

message SetDeviceTrafficCaptureRequest {
  string id = 1;
  bool capture = 2;
}

message GetDeviceTrafficRequest {
  string id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message DeviceTrafficReply {
  // The largest conversations first; at most a few hundred.
  repeated TrafficEntry entries = 1;
}

message TrafficEntry {
  // Tcp, Udp, Icmp or Other.
  string transport = 1;
  // The highest protocol recognised in the packets, for example TLS or DNS.
  string protocol = 2;
  string remote_address = 3;
  // Not set for traffic without ports, such as ICMP.
  optional int32 service_port = 4;
  int64 packets_sent = 5;
  int64 packets_received = 6;
  int64 bytes_sent = 7;
  int64 bytes_received = 8;
}

message GetDeviceResourcesRequest {
  string id = 1;
}

message DeviceResourcesReply {
  // False when the device has not reported any resources, for example because it has no agent.
  bool has_data = 1;
  google.protobuf.Timestamp recorded_at = 2;
  optional double cpu_usage_percent = 3;
  uint64 memory_total_bytes = 4;
  uint64 memory_used_bytes = 5;
  repeated DiskInfo disks = 6;
  repeated NetworkInterfaceInfo network_interfaces = 7;
}

message DiskInfo {
  string name = 1;
  uint64 total_bytes = 2;
  uint64 free_bytes = 3;
}

message NetworkInterfaceInfo {
  string name = 1;
  string mac_address = 2;
  string ip_address = 3;
  bool is_up = 4;
  uint64 bytes_sent = 5;
  uint64 bytes_received = 6;
}

message GetDeviceActivityRequest {
  string id = 1;
}

message GetDeviceActivityHistoryRequest {
  string id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message DeviceActivityHistoryReply {
  // The most recently started first.
  repeated ProcessRunInfo processes = 1;
  // The most recently opened first.
  repeated PortPeriodInfo ports = 2;
  // True when the period had more process runs or port periods than are returned; the most recent ones are.
  bool truncated = 3;
}

message ProcessRunInfo {
  uint32 pid = 1;
  string name = 2;
  google.protobuf.Timestamp started_at = 3;
  // Not set while the process is running.
  google.protobuf.Timestamp ended_at = 4;
}

message PortPeriodInfo {
  string protocol = 1;
  string local_address = 2;
  uint32 port = 3;
  google.protobuf.Timestamp opened_at = 4;
  // Not set while the port is open.
  google.protobuf.Timestamp closed_at = 5;
  // Zero and empty when the owning process is not known.
  uint32 pid = 6;
  string process_name = 7;
}

message DeviceActivityReply {
  repeated ProcessDetail processes = 1;
  repeated ListeningPortDetail listening_ports = 2;
  repeated ConnectionDetail connections = 3;
}

message ProcessDetail {
  uint32 pid = 1;
  string name = 2;
  google.protobuf.Timestamp started_at = 3;
  // Usage is recorded only for the most demanding processes.
  bool has_usage = 4;
  optional double cpu_usage_percent = 5;
  uint64 memory_bytes = 6;
}

message ListeningPortDetail {
  string protocol = 1;
  string local_address = 2;
  uint32 port = 3;
  google.protobuf.Timestamp opened_at = 4;
  // Zero and empty when the owning process is not known.
  uint32 pid = 5;
  string process_name = 6;
}

message ConnectionDetail {
  string protocol = 1;
  string local_address = 2;
  uint32 local_port = 3;
  string remote_address = 4;
  uint32 remote_port = 5;
  string state = 6;
  uint32 pid = 7;
  string process_name = 8;
}

message GetDeviceHistoryRequest {
  string id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message DeviceHistoryReply {
  // Share of the period the device was not in an outage. Not set when the device did not exist in the period.
  optional double availability_percent = 1;
  // Total length of the outages inside the period.
  int64 downtime_seconds = 2;
  // The most recent first.
  repeated OutageInfo outages = 3;
  // The most recent first.
  repeated EventInfo events = 4;
  // True when the period has more events than were returned.
  bool events_truncated = 5;
  // Processor and memory points of earlier versions; the charts show the network now.
  reserved 6;
  reserved "resource_points";
  // The oldest first; long periods are averaged down to a limited number of points.
  repeated NetworkPointInfo network_points = 7;
}

message OutageInfo {
  google.protobuf.Timestamp started_at = 1;
  // Not set while the outage is still in progress.
  google.protobuf.Timestamp ended_at = 2;
}

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_WARNING = 2;
  EVENT_SEVERITY_ERROR = 3;
}

message EventInfo {
  google.protobuf.Timestamp occurred_at = 1;
  // Name of the event type, for example "DeviceWentOffline".
  string type = 2;
  EventSeverity severity = 3;
  string message = 4;
}

message GetEventLogRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message EventLogReply {
  repeated EventLogEntry events = 1;
  // True when the period had more events than are returned; the newest ones are.
  bool truncated = 2;
}

message EventLogEntry {
  google.protobuf.Timestamp occurred_at = 1;
  // Name of the event type, for example "SettingsChanged".
  string type = 2;
  EventSeverity severity = 3;
  string message = 4;
  // Empty for an event of the system as a whole, or when the device no longer exists.
  string device_name = 5;
  // Empty when the event was not caused by a user, or the user no longer exists.
  string user_name = 6;
}

// Traffic of a device per second since the previous point, and the response time the server measured.
// A value is not set where it is not known: traffic of a device without an agent, the response time of one with an
// agent or while the device did not answer.
message NetworkPointInfo {
  google.protobuf.Timestamp recorded_at = 1;
  optional double bytes_sent_per_second = 2;
  optional double bytes_received_per_second = 3;
  optional double response_time_ms = 4;
}

message SendFileRequest {
  oneof part {
    SendFileHeader header = 1;
    // A part of the contents, at most 1 MB.
    bytes data = 2;
  }
}

message SendFileHeader {
  string device_id = 1;
  // Name only, without a folder; it is the name the file gets on the device.
  string file_name = 2;
  // Size of the whole file in bytes; the upload is refused when the contents do not match.
  int64 size = 3;
}

message SendCommandRequest {
  string device_id = 1;
  // Name of the command, which is also the name of the permission it needs, for example "RestartDevice".
  string type = 2;
  // Process identifier, service name or target address, depending on the command; empty when it takes none.
  string parameter = 3;
}

message CommandInfo {
  string id = 1;
  string type = 2;
  string parameter = 3;
  // "Pending", "Sent", "Succeeded", "Failed" or "Expired".
  string status = 4;
  string requested_by = 5;
  google.protobuf.Timestamp requested_at = 6;
  // Not set until the command has finished.
  google.protobuf.Timestamp completed_at = 7;
  string result_message = 8;
}

message ListDeviceCommandsRequest {
  string device_id = 1;
}

message ListDeviceCommandsReply {
  repeated CommandInfo commands = 1;
}

message GetMonitoringSettingsRequest {
}

message UpdateSyncIntervalRequest {
  int32 sync_interval_seconds = 1;
}

message UpdateOfflineThresholdRequest {
  int32 offline_after_missed_syncs = 1;
}

message UpdateRetentionRequest {
  int32 retention_days = 1;
}

message MonitoringSettingsInfo {
  int32 sync_interval_seconds = 1;
  int32 offline_after_missed_syncs = 2;
  int32 min_sync_interval_seconds = 3;
  int32 max_sync_interval_seconds = 4;
  int32 retention_days = 5;
  int32 max_offline_after_missed_syncs = 6;
  int32 max_retention_days = 7;
}
